<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>構造計算たわみシミュレーター</title>
  <meta name="theme-color" content="#1e293b">
  <!-- Web App Manifest (インライン埋め込み) -->
  <link rel="manifest" href='data:application/manifest+json,{
    "name": "構造計算たわみシミュレーター",
    "short_name": "たわみ計算",
    "start_url": "./",
    "display": "standalone",
    "background_color": "#0f172a",
    "theme_color": "#1e293b",
    "icons": [{
      "src": "https://cdn-icons-png.flaticon.com/512/4300/4300058.png",
      "sizes": "192x192",
      "type": "image/png"
    }]
  }'>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --border-color: #334155;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
    }
    h1 {
      font-size: 1.25rem;
      margin-top: 0;
      text-align: center;
      color: var(--accent-color);
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
    }
    .condition-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .radio-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      background: #0f172a;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    label {
      font-size: 0.8rem;
      color: #94a3b8;
    }
    input[type="number"] {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      font-size: 1rem;
      width: 100%;
      box-sizing: border-box;
    }
    .result-box {
      margin-top: 20px;
      background: #0f172a;
      border: 1px solid var(--accent-color);
      padding: 16px;
      border-radius: 8px;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }
    .result-val {
      font-weight: bold;
      color: var(--accent-color);
    }
    .main-result {
      font-size: 1.3rem;
      color: #4ade80;
      border-top: 1px solid var(--border-color);
      padding-top: 8px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>構造計算たわみシミュレーター</h1>

  <div class="condition-group">
    <label class="radio-label">
      <input type="radio" name="condition" value="A" checked onchange="calculate()">
      条件A: 単純梁（等分布荷重）
    </label>
    <label class="radio-label">
      <input type="radio" name="condition" value="B" onchange="calculate()">
      条件B: 片持ち固定（等分布荷重）
    </label>
    <label class="radio-label">
      <input type="radio" name="condition" value="C" onchange="calculate()">
      条件C: 単純梁（中央集中荷重）
    </label>
  </div>

  <div class="grid">
    <div class="input-group">
      <label id="label-x">荷重 X (N/m²)</label>
      <input type="number" id="X" value="3000" oninput="calculate()">
    </div>
    <div class="input-group">
      <label id="label-y">負担 Y (m)</label>
      <input type="number" id="Y" value="3.0" step="0.1" oninput="calculate()">
    </div>
    <div class="input-group">
      <label>梁の長さ L (m)</label>
      <input type="number" id="L" value="6.0" step="0.1" oninput="calculate()">
    </div>
    <div class="input-group">
      <label>ヤング係数 E (N/mm²)</label>
      <input type="number" id="E" value="10500" oninput="calculate()">
    </div>
    <div class="input-group">
      <label>断面幅 b (mm)</label>
      <input type="number" id="b" value="120" oninput="calculate()">
    </div>
    <div class="input-group">
      <label>断面高さ h (mm)</label>
      <input type="number" id="h" value="300" oninput="calculate()">
    </div>
    <div class="input-group" id="group-N">
      <label>補正・安全係数 N</label>
      <input type="number" id="N" value="1.0" step="0.1" oninput="calculate()">
    </div>
  </div>

  <div class="result-box">
    <div class="result-row">
      <span>作用荷重 F:</span>
      <span class="result-val" id="res-F">- N</span>
    </div>
    <div class="result-row">
      <span>断面二次モーメント I:</span>
      <span class="result-val" id="res-I">- mm⁴</span>
    </div>
    <div class="result-row main-result">
      <span>たわみ量 δ:</span>
      <span class="result-val" id="res-delta" style="color: #4ade80;">- mm</span>
    </div>
    <div class="result-row">
      <span>たわみスパン比 (δ/L):</span>
      <span class="result-val" id="res-ratio">-</span>
    </div>
  </div>
</div>

<script>
  function calculate() {
    const condition = document.querySelector('input[name="condition"]:checked').value;
    const X = parseFloat(document.getElementById('X').value) || 0;
    const Y = parseFloat(document.getElementById('Y').value) || 0;
    const L = parseFloat(document.getElementById('L').value) || 0;
    const E = parseFloat(document.getElementById('E').value) || 0;
    const b = parseFloat(document.getElementById('b').value) || 0;
    const h = parseFloat(document.getElementById('h').value) || 0;
    const N = parseFloat(document.getElementById('N').value) || 1.0;

    // UIのラベル切り替え制御
    document.getElementById('group-N').style.opacity = (condition === 'A') ? '0.3' : '1.0';
    document.getElementById('label-x').innerText = (condition === 'C') ? '集中荷重 X (N)' : '単位面積荷重 X (N/m²)';
    document.getElementById('label-y').innerText = (condition === 'C') ? '負担率 Y' : '負担幅 Y (m)';

    // 断面二次モーメント I [mm4]
    const I = (b * Math.pow(h, 3)) / 12;
    // 梁の長さ [mm] 換算 (1m = 1000mm)
    const L_mm = L * 1000;

    let F = 0;
    let delta = 0;

    if (condition === 'A') {
      // 条件A: 単純梁（等分布荷重） F = X * Y * L [N]
      F = X * Y * L;
      if (E > 0 && I > 0) {
        delta = (5 * F * Math.pow(L_mm, 3)) / (384 * E * I);
      }
    } else if (condition === 'B') {
      // 条件B: 片持ち固定（等分布荷重） F = X * Y * L [N]
      F = X * Y * L;
      if (E > 0 && I > 0 && N > 0) {
        delta = (F * Math.pow(L_mm, 3)) / (8 * N * E * I);
      }
    } else if (condition === 'C') {
      // 条件C: 単純梁（中央集中荷重） F = X * Y [N]
      F = X * Y;
      if (E > 0 && I > 0 && N > 0) {
        delta = (F * Math.pow(L_mm, 3)) / (48 * N * E * I);
      }
    }

    // 表示更新処理
    document.getElementById('res-F').innerText = F.toLocaleString(undefined, {maximumFractionDigits: 1}) + ' N';
    document.getElementById('res-I').innerText = Math.round(I).toLocaleString() + ' mm⁴';
    document.getElementById('res-delta').innerText = delta.toFixed(3) + ' mm';
    document.getElementById('res-ratio').innerText = (L_mm > 0 && delta > 0) ? '1 / ' + Math.round(L_mm / delta) : '-';
  }

  // 初期読み込み時の計算実行
  calculate();

  // オフライン PWA用 Service Worker
  if ('serviceWorker' in navigator) {
    const swCode = `
      const CACHE_NAME = 'struct-calc-v3';
      self.addEventListener('install', e => {
        e.waitUntil(caches.open(CACHE_NAME).then(cache => cache.add('./')));
      });
      self.addEventListener('fetch', e => {
        e.respondWith(caches.match(e.request).then(res => res || fetch(e.request)));
      });
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob));
  }
</script>

</body>
</html>
